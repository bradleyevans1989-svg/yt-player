<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#1f3a3a"/>
      <stop offset="1" stop-color="#0b1414"/>
    </radialGradient>
    <linearGradient id="bone" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fbf0d4"/>
      <stop offset="0.6" stop-color="#ecd29c"/>
      <stop offset="1" stop-color="#c99a5b"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8b24e"/>
      <stop offset="0.45" stop-color="#6f7a2c"/>
      <stop offset="0.8" stop-color="#8a2a22"/>
      <stop offset="1" stop-color="#b3222a"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e979c"/>
      <stop offset="0.45" stop-color="#f2f5f6"/>
      <stop offset="1" stop-color="#7d868b"/>
    </linearGradient>
    <radialGradient id="socket" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#c3242c"/>
      <stop offset="1" stop-color="#3d070b"/>
    </radialGradient>
    <radialGradient id="mouth" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#b01e27"/>
      <stop offset="1" stop-color="#2c0507"/>
    </radialGradient>
    <clipPath id="mouthClip"><ellipse cx="256" cy="368" rx="54" ry="52"/></clipPath>
    <!-- skull silhouette, reused for halo, outline and fill -->
    <g id="skull">
      <ellipse cx="256" cy="200" rx="122" ry="112"/>
      <path d="M148 214 Q146 296 192 318 L320 318 Q366 296 364 214 Z"/>
      <path d="M190 322 Q186 450 256 452 Q326 450 322 322 Z"/>
    </g>
    <path id="leafShape" d="M0 0 Q40 -46 110 -10 Q52 34 0 0 Z"/>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- leaves -->
  <g stroke="#1a1214" stroke-width="7" stroke-linejoin="round" fill="url(#leaf)">
    <use href="#leafShape" transform="translate(160 400) rotate(155) scale(1.35)"/>
    <use href="#leafShape" transform="translate(150 320) rotate(195) scale(1.3)"/>
    <use href="#leafShape" transform="translate(352 160) rotate(-38) scale(1.3)"/>
    <use href="#leafShape" transform="translate(366 230) rotate(8) scale(1.3)"/>
  </g>

  <!-- dagger blade (behind skull, tip comes out under the jaw) -->
  <g transform="translate(-4 -34) rotate(22 256 256)" stroke="#1a1214" stroke-width="8" stroke-linejoin="round">
    <path d="M238 120 L274 120 L272 520 L256 560 L240 520 Z" fill="url(#steel)"/>
  </g>

  <!-- skull: white sticker halo, black outline, bone fill -->
  <use href="#skull" fill="#f4efe6" stroke="#f4efe6" stroke-width="40" stroke-linejoin="round"/>
  <use href="#skull" fill="#1a1214" stroke="#1a1214" stroke-width="20" stroke-linejoin="round"/>
  <use href="#skull" fill="url(#bone)"/>

  <!-- dagger handle, stabbed into the skull -->
  <g transform="translate(-4 -34) rotate(22 256 256)" stroke="#1a1214" stroke-width="8" stroke-linejoin="round">
    <rect x="236" y="46" width="40" height="78" rx="10" fill="url(#steel)"/>
    <g stroke="#1a1214" stroke-width="4" fill="#e9b52f">
      <rect x="236" y="62" width="40" height="8"/><rect x="236" y="82" width="40" height="8"/><rect x="236" y="102" width="40" height="8"/>
    </g>
    <path d="M256 6 Q284 10 282 40 Q280 54 256 54 Q232 54 230 40 Q228 10 256 6 Z" fill="#b5212a"/>
    <path d="M200 124 Q256 108 312 124 L306 140 Q256 128 206 140 Z" fill="#e9b52f"/>
  </g>

  <!-- jaw line -->
  <path d="M192 320 Q256 330 320 320" stroke="#1a1214" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- screaming mouth -->
  <ellipse cx="256" cy="368" rx="54" ry="52" fill="url(#mouth)" stroke="#1a1214" stroke-width="8"/>
  <g clip-path="url(#mouthClip)" stroke="#1a1214" stroke-width="4" fill="#fbf3dc">
    <rect x="203" y="306" width="18" height="32" rx="4"/><rect x="221" y="306" width="18" height="34" rx="4"/>
    <rect x="239" y="306" width="17" height="36" rx="4"/><rect x="256" y="306" width="17" height="36" rx="4"/>
    <rect x="273" y="306" width="18" height="34" rx="4"/><rect x="291" y="306" width="18" height="32" rx="4"/>
    <rect x="207" y="400" width="20" height="30" rx="4"/><rect x="227" y="396" width="19" height="32" rx="4"/>
    <rect x="246" y="394" width="20" height="34" rx="4"/><rect x="266" y="396" width="19" height="32" rx="4"/>
    <rect x="285" y="400" width="20" height="30" rx="4"/>
  </g>

  <!-- teal sugar-skull filigree -->
  <g stroke="#14898a" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M256 104 L256 150 M240 120 L272 120"/>
    <path d="M232 160 Q206 150 212 128 Q218 112 232 120"/>
    <path d="M280 160 Q306 150 300 128 Q294 112 280 120"/>
    <path d="M176 292 Q164 270 180 262 Q194 258 194 274"/>
    <path d="M336 292 Q348 270 332 262 Q318 258 318 274"/>
  </g>
  <g fill="#14898a">
    <circle cx="160" cy="214" r="5"/><circle cx="176" cy="180" r="5"/><circle cx="206" cy="168" r="5"/>
    <circle cx="352" cy="214" r="5"/><circle cx="336" cy="180" r="5"/><circle cx="306" cy="168" r="5"/>
  </g>

  <!-- angry eye sockets -->
  <g stroke="#1a1214" stroke-width="8" stroke-linejoin="round" fill="url(#socket)">
    <path d="M168 200 Q182 176 238 208 Q242 254 204 260 Q166 256 168 200 Z"/>
    <path d="M344 200 Q330 176 274 208 Q270 254 308 260 Q346 256 344 200 Z"/>
    <path d="M256 270 L240 302 Q256 294 272 302 Z" fill="#3d070b"/>
  </g>

  <!-- cracks and highlights -->
  <g stroke="#1a1214" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M318 98 L304 126 L320 140 L308 166"/>
    <path d="M150 250 L170 262 L166 280"/>
  </g>
  <g stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M170 150 Q186 114 222 98"/>
    <path d="M160 176 L162 168"/>
  </g>
</svg>
