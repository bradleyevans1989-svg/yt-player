<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#5a0f1d"/>
      <stop offset="1" stop-color="#120609"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e2d6"/>
    </linearGradient>
    <clipPath id="mouth"><ellipse cx="256" cy="366" rx="56" ry="56"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- scream lines -->
  <g stroke="#ff3b4f" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M150 340 L104 326"/>
    <path d="M152 378 L96 384"/>
    <path d="M162 414 L118 440"/>
    <path d="M362 340 L408 326"/>
    <path d="M360 378 L416 384"/>
    <path d="M350 414 L394 440"/>
  </g>

  <!-- skull -->
  <g fill="url(#bone)">
    <ellipse cx="256" cy="196" rx="124" ry="114"/>
    <path d="M146 214 Q144 296 192 316 L320 316 Q368 296 366 214 Z"/>
    <path d="M186 322 Q182 452 256 454 Q330 452 326 322 Z"/>
  </g>

  <!-- open mouth with teeth -->
  <ellipse cx="256" cy="366" rx="56" ry="56" fill="#120609"/>
  <g clip-path="url(#mouth)" fill="url(#bone)">
    <rect x="200" y="300" width="112" height="30"/>
    <g fill="#120609">
      <rect x="221" y="314" width="5" height="18"/><rect x="243" y="314" width="5" height="18"/>
      <rect x="264" y="314" width="5" height="18"/><rect x="286" y="314" width="5" height="18"/>
    </g>
    <rect x="200" y="404" width="112" height="30"/>
    <g fill="#120609">
      <rect x="221" y="400" width="5" height="16"/><rect x="243" y="400" width="5" height="16"/>
      <rect x="264" y="400" width="5" height="16"/><rect x="286" y="400" width="5" height="16"/>
    </g>
  </g>

  <!-- angry eye sockets with glowing eyes -->
  <g fill="#120609">
    <path d="M160 196 Q176 166 236 206 Q240 256 200 262 Q158 258 160 196 Z"/>
    <path d="M352 196 Q336 166 276 206 Q272 256 312 262 Q354 258 352 196 Z"/>
    <path d="M256 268 L238 302 Q256 294 274 302 Z"/>
  </g>
  <circle cx="203" cy="228" r="11" fill="#ff3b4f"/>
  <circle cx="309" cy="228" r="11" fill="#ff3b4f"/>

  <!-- crack -->
  <path d="M292 86 L280 118 L298 132 L284 160" stroke="#120609" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
